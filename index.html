<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orava päevik">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Orava päevik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column; a soft meadow scene with the pink squirrel on top, white cards below, floating pill menu + plus button. */
:root{
  color-scheme: light;
  --bg:#FFF3F6;
  --card:#FFFFFF;
  --ink:#3B2A35;
  --muted:#A08B97;
  --line:#F3E3E9;
  --pink:#FBC8D6;
  --pink-deep:#EE8FAB;
  --kcal:#F58E6B;
  --water:#5EAEF2;
  --fast:#9C8CF0;
  --good:#5FBF8C;
  --sky:#DDF4EC;
  --hill:#BDE6C6;
  --hill2:#A5DBB3;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;line-height:1.35}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:460px;margin:0 auto;min-height:100%;padding-bottom:120px;position:relative}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* scene */
.scene{position:relative;background:linear-gradient(#FFE3EC,#FFF1F5);padding:18px 20px 0;overflow:hidden;border-radius:0 0 36px 36px}
.scene>*{position:relative;z-index:1}
.scene>.clouds{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.clouds .drift{animation:drift 14s ease-in-out infinite alternate}
.clouds .friend{animation:friend 7s ease-in-out infinite}
.clouds .bear{transform-box:fill-box;transform-origin:50% 100%}
.clouds .br{animation:eartw 4.500s ease-in-out infinite}
.clouds .bl{animation:eartw 6s ease-in-out 1s infinite}
@keyframes eartw{0%,84%,100%{transform:rotate(0)}89%{transform:rotate(14deg)}94%{transform:rotate(-5deg)}}
@keyframes friend{0%,12%,100%{transform:translateY(26px)}26%,78%{transform:translateY(0)}34%{transform:translateY(-3px)}}
.clouds .drift2{animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(12px)}}
@media (prefers-reduced-motion:reduce){.clouds *{animation:none}}
.scene-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pet-name{font-family:var(--display);font-weight:800;font-size:32px;line-height:1}
.hearts{display:flex;gap:4px;margin-top:8px}
.hearts svg{width:24px;height:24px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.pet-wrap{display:flex;justify-content:center;margin-top:2px}
.pet-wrap svg{width:240px;height:auto;display:block}
.streak{position:absolute;right:20px;bottom:76px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0}
.streak svg{width:32px;height:32px;animation:beat 1.800s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.150)}24%{transform:scale(1)}36%{transform:scale(1.100)}48%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.streak svg{animation:none}}
.streak b{font-family:var(--display);font-size:20px;line-height:1}
.streak span{font-size:11.5px;font-weight:700}
.bubble{background:var(--card);border:2px solid #FFDCE6;border-radius:18px;padding:10px 14px;margin:0 0 16px;font-size:14.5px;font-weight:700;text-align:center;box-shadow:0 4px 0 rgba(59,42,53,.06)}

/* squirrel */
.sq{overflow:visible;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pet-wrap{position:relative}
.scene>.feed{position:absolute;left:16px;bottom:76px;z-index:4;display:flex;flex-direction:column-reverse;align-items:center;gap:8px}
.feed-btn{display:flex;flex-direction:column;align-items:center;gap:0;min-width:52px;padding:2px 4px;border-radius:16px;font-size:11.500px;font-weight:700;line-height:1.2}
.feed-btn svg{width:54px;height:54px;transition:transform .2s;filter:drop-shadow(0 3px 6px rgba(59,42,53,.12))}
.feed-btn .peek{animation:peek 5s ease-in-out infinite}
.feed.open .feed-btn .peek{animation:none;transform:translateY(-6px)}
@keyframes peek{0%,18%,100%{transform:translateY(11px)}32%,82%{transform:translateY(-4px)}40%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.feed-btn .peek{animation:none}}
.feed-btn:active svg{transform:scale(.9)}
.feed.open .feed-btn svg{transform:scale(1.060)}
.tray{display:none;flex-direction:column;gap:4px;background:rgba(255,255,255,.94);border-radius:26px;padding:6px 5px;box-shadow:0 6px 18px rgba(59,42,53,.12)}
.feed.open .tray{display:flex}
.treat{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.treat:active{cursor:grabbing}
.treat svg{width:29px;height:29px;pointer-events:none}
.treat.lifted svg{opacity:.25}
.tray-hint{font-size:10.500px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1;padding:2px 0 4px}
.ghost{position:fixed;z-index:50;width:58px;height:58px;pointer-events:none;transform:translate(-50%,-50%) rotate(-8deg);filter:drop-shadow(0 6px 8px rgba(59,42,53,.25))}
.ghost svg,.bite svg{width:100%;height:100%;display:block}
.bite{position:absolute;width:44px;height:44px;pointer-events:none;z-index:3;animation:bite 1.200s steps(1) forwards}
@keyframes bite{0%{transform:translate(-50%,-50%) scale(1)}25%{transform:translate(-50%,-50%) scale(.75) rotate(8deg)}50%{transform:translate(-50%,-50%) scale(.5) rotate(-8deg)}75%{transform:translate(-50%,-50%) scale(.28) rotate(6deg)}100%{transform:translate(-50%,-50%) scale(0)}}
.pop{position:absolute;pointer-events:none;z-index:3;font-family:var(--display);font-weight:800;font-size:19px;color:#E0668C;white-space:nowrap;animation:pop 1s ease-out forwards}
.pop svg{width:22px;height:22px;display:block}
@keyframes pop{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),-95px) scale(1.250)}}
.sq .happy,.sq .ok,.sq .sad{display:none}
.sq.m-happy .happy,.sq.m-ok .ok,.sq.m-sad .sad{display:inline}
.sq .body-all{transform-origin:130px 258px;animation:breathe 3s ease-in-out infinite}
.sq .head{transform-origin:126px 186px;animation:tilt 5s ease-in-out infinite}
.sq .tail{transform-origin:186px 238px;animation:sway 3.400s ease-in-out infinite}
.sq .eyes{transform-origin:126px 132px;animation:blink 4.200s infinite}
.sq.m-happy .eyes{animation:none}
.sq .ear-l{transform-origin:66px 80px;animation:twitch 5.500s ease-in-out infinite}
.sq .ear-r{transform-origin:188px 80px;animation:twitch 5.500s ease-in-out .2s infinite reverse}
.sq .hands{animation:nibble 5s ease-in-out infinite}
.sq.m-happy .hands{animation-duration:3s}
.sq.m-happy .body-all{animation:wiggle 1.600s ease-in-out infinite}
.sq.m-sad .hands{animation:none;transform:translateY(8px)}
.sq.m-sad .tail{animation-duration:7s}
.sq.m-sad .head{animation:none;transform:rotate(-3deg) translateY(4px)}
.sq .bowflop{transform-box:fill-box;transform-origin:50% 25%;animation:flop 2.800s ease-in-out infinite}
@keyframes flop{0%,100%{transform:rotate(-3deg) scaleY(1)}50%{transform:rotate(3deg) scaleY(1.060)}}
.sq.tickle .ok,.sq.tickle .sad{display:none!important}
.sq.tickle .happy{display:inline!important}
.sq.tickle .body-all{animation:giggle .24s ease-in-out infinite}
.sq.tickle .head{animation:tilt .5s ease-in-out infinite;transform:none}
.sq.tickle .hands{animation:none;transform:translateY(-5px)}
.sq.tickle .tail{animation-duration:.45s}
.sq.tickle .ear-l,.sq.tickle .ear-r{animation-duration:.6s}
@keyframes giggle{0%,100%{transform:rotate(-3deg) translateY(0) scale(1.025,.975)}50%{transform:rotate(3deg) translateY(-4px) scale(.98,1.030)}}
.sq.eat .ok,.sq.eat .sad,.sq.want .ok,.sq.want .sad{display:none!important}
.sq.eat .happy,.sq.want .happy{display:inline!important}
.sq.want .head{animation:none;transform:rotate(-4deg) translateY(-3px)}
.sq.eat .head{animation:chew .30s ease-in-out infinite;transform:none}
.sq.eat .hands{animation:none}
.sq.eat .tail{animation-duration:.8s}
@keyframes chew{0%,100%{transform:scale(1.035,.965)}50%{transform:scale(.985,1.025)}}
.sq .hopper{transform-origin:130px 262px}
.sq.hop .hopper{animation:hop .7s cubic-bezier(.3,.7,.4,1)}
.sq.hop .shadow{animation:shadow .7s ease-out;transform-origin:130px 262px}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.020,.975)}}
@keyframes wiggle{0%,100%{transform:rotate(-2.500deg) scale(1,1)}50%{transform:rotate(2.500deg) scale(1.015,.985)}}
@keyframes tilt{0%,100%{transform:rotate(-1.500deg)}50%{transform:rotate(2deg)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes twitch{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-10deg)}94%{transform:rotate(5deg)}}
@keyframes nibble{0%,58%,100%{transform:translateY(0)}64%{transform:translateY(-14px)}68%{transform:translateY(-11px)}72%{transform:translateY(-14px)}76%{transform:translateY(-11px)}80%{transform:translateY(-14px)}88%{transform:translateY(0)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.070,.9)}45%{transform:translateY(-30px) scale(.96,1.050)}80%{transform:translateY(0) scale(1.050,.93)}}
@keyframes shadow{0%,100%{transform:scale(1)}45%{transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.sq *{animation:none!important}}

/* night and sleeping */
.scene.night{background:linear-gradient(#35285A,#7A5390)}
.scene.night .pet-name,.scene.night .streak{color:#fff}
.scene.night>.clouds{opacity:.22}
.scene.night>.feed{display:none}
.scene>.nightsky{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.nightsky .star{animation:twinkle 2.600s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
.sq-sleep{overflow:visible}
.sq-sleep .snore{transform-origin:130px 250px;animation:snore 3.600s ease-in-out infinite}
.sq-sleep .sleephead{transform-origin:130px 170px;animation:snorehead 3.600s ease-in-out infinite}
.sq-sleep .mouth{transform-box:fill-box;transform-origin:center;animation:snoremouth 3.600s ease-in-out infinite}
.sq-sleep .z{opacity:0;transform-box:fill-box;animation:zzz 3.600s ease-in infinite}
.sq-sleep .z2{animation-delay:.7s}.sq-sleep .z3{animation-delay:1.400s}
@keyframes snore{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1.045)}}
@keyframes snorehead{0%,100%{transform:rotate(0) translateY(0)}45%{transform:rotate(-1.500deg) translateY(-2px)}}
@keyframes snoremouth{0%,100%{transform:scale(.7)}45%{transform:scale(1.150)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,6px) scale(.7)}25%{opacity:.95}100%{opacity:0;transform:translate(10px,-22px) scale(1.150)}}
@media (prefers-reduced-motion:reduce){.sq-sleep *,.nightsky .star{animation:none!important}.sq-sleep .z{opacity:.9}}

/* cards */
.stack{display:flex;flex-direction:column;gap:14px;padding:16px 16px 0}
.card{background:var(--card);border-radius:26px;padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.label{font-size:14px;font-weight:800;color:var(--muted)}
.today{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c .num{font-size:26px;line-height:1}
.today-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kv .num{font-size:18px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:800}
.pill.good{background:#E3F6EC;color:#2E8A5B}
.pill.warn{background:#FFE7DF;color:#C2542D}
.pill.idle{background:var(--line);color:var(--muted)}
.btn{min-height:48px;border-radius:16px;padding:0 18px;font-weight:800;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.soft{background:var(--line);color:var(--ink)}
.btn.pink{background:var(--pink);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:40px;border-radius:13px;padding:0 13px;font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:40px;padding:0 14px;border-radius:99px;background:var(--line);font-weight:800;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--fast);color:#fff}
.timer{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .num{font-size:16px}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.x svg{width:18px;height:18px}
.ico{width:22px;height:22px;flex:none}
.demo{background:#FFF8DC;border-radius:18px;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo button{font-weight:800;text-decoration:underline;white-space:nowrap}

/* page headers */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;padding:26px 20px 4px;gap:12px}
.page-h h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.navs{display:flex;gap:6px}
.navs button{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.navs button:disabled{opacity:.35;cursor:default}
.navs svg{width:20px;height:20px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12.5px;font-weight:800;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.day.sel{background:var(--pink)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.future{color:#D5C6CE;cursor:default}
.dots{display:flex;gap:3px;height:7px}
.dots i{width:7px;height:7px;border-radius:50%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}

/* stats */
.big{display:flex;align-items:baseline;gap:8px}
.big .num{font-size:38px;line-height:1}
.big .u{font-family:var(--display);font-weight:700;font-size:22px;color:#CDBFC6}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.week div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--muted)}
.week i{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.week i.ok{background:var(--good)}
.week i.no{background:#FFD9CC}
.week i svg{width:14px;height:14px}

/* goals */
.goal{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal .t{flex:1;min-width:0;overflow-wrap:anywhere}
.goal.done .t{color:var(--muted);text-decoration:line-through}
.tick{width:30px;height:30px;border-radius:50%;border:2.500px solid #E7CFD8;display:grid;place-items:center;flex:none}
.tick svg{width:16px;height:16px;display:none}
.goal.done .tick{background:var(--good);border-color:var(--good)}
.goal.done .tick svg{display:block}
.goal-form{display:flex;gap:8px;margin-top:12px}
.goal-form input{flex:1;min-width:0;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-weight:700}

/* vision board */
.board{columns:2;column-gap:10px}
.pin{display:block;width:100%;text-align:left;break-inside:avoid;margin:0 0 10px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 3px 0 rgba(59,42,53,.05)}
.pin img{display:block;width:100%;height:auto}
.pin span{display:block;padding:9px 12px 11px;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.pin.add{border:2.500px dashed #EBC6D2;background:none;box-shadow:none;min-height:120px;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:800;padding:16px}
.pin.add svg{width:26px;height:26px;margin:0 auto 4px;display:block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.vh:focus-visible+label{outline:3px solid var(--pink-deep);outline-offset:2px}
.prev{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:14px;margin:10px 0;background:var(--line)}
.prev[hidden]{display:none}

/* app feel: loading screen, transitions, press feedback, toast */
html{-webkit-text-size-adjust:100%}
button,a,input,label{touch-action:manipulation}
button,.nav,.label,.card-h,.page-h{-webkit-user-select:none;user-select:none}
button{transition:transform .12s ease,background-color .2s ease,opacity .2s ease}
button:active{transform:scale(.95)}
.tabs button{transition:background-color .25s ease,color .25s ease,transform .12s ease}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(#FFDDE8,#FFF3F6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease,visibility .45s ease}
#splash.out{opacity:0;visibility:hidden}
#spArt{width:132px;height:132px;animation:spbob 1.200s ease-in-out infinite}
#spArt svg{width:100%;height:100%;display:block}
#spArt .peek{animation:none;transform:translateY(-5px)}
.sp-name{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.sp-bar{width:150px;height:8px;border-radius:99px;background:#fff;overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;border-radius:99px;background:var(--pink-deep);transform-origin:left;animation:spload 1.150s cubic-bezier(.4,.1,.3,1) both}
@keyframes spload{from{transform:scaleX(.06)}to{transform:scaleX(1)}}
@keyframes spbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#view.enter{animation:viewin .34s cubic-bezier(.2,.7,.3,1) both}
#view.enter .stack>*{animation:cardin .42s cubic-bezier(.2,.7,.3,1) both}
#view.enter .stack>*:nth-child(1){animation-delay:.04s}#view.enter .stack>*:nth-child(2){animation-delay:.09s}
#view.enter .stack>*:nth-child(3){animation-delay:.14s}#view.enter .stack>*:nth-child(4){animation-delay:.19s}#view.enter .stack>*:nth-child(n+5){animation-delay:.24s}
#view.enter .bar i{transform-origin:left;animation:growx .7s .2s cubic-bezier(.2,.7,.3,1) both}
#view.enter .cb{transform-box:fill-box;transform-origin:50% 100%;animation:growy .6s .2s cubic-bezier(.2,.7,.3,1) both}
#view.enter .ring circle:nth-child(2){animation:ringin .9s .15s cubic-bezier(.2,.7,.3,1) both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ringin{from{stroke-dasharray:0 400}}
.scrim{animation:fadein .22s ease both}
.sheet{animation:sheetup .34s cubic-bezier(.2,.8,.3,1) both}
.scrim.closing{animation:fadeout .22s ease both}
.scrim.closing .sheet{animation:sheetdown .22s ease-in both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetdown{from{transform:none}to{transform:translateY(100%)}}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-24px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-weight:800;font-size:14.500px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(59,42,53,.25);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .3s ease}
#toast.on{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){#view.enter,#view.enter *,.scrim,.sheet,#spArt,.sp-bar i{animation:none!important}button:active{transform:none}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
.nav-in{max-width:460px;margin:0 auto;padding:0 20px 18px;display:flex;justify-content:space-between;align-items:center}
.tabs{pointer-events:auto;display:flex;gap:2px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:99px;padding:6px;box-shadow:0 8px 24px rgba(59,42,53,.14)}
.tabs button{width:54px;height:52px;border-radius:99px;display:grid;place-items:center;color:#CDBFC6}
.tabs button[aria-current="page"]{background:var(--pink);color:var(--ink)}
.tabs svg{width:24px;height:24px}
.fab{pointer-events:auto;width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(59,42,53,.25)}
.fab svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(59,42,53,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;padding:16px 16px 26px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h h2{font-family:var(--display);font-weight:800;font-size:24px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--card)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:13.5px;font-weight:800;color:var(--muted)}
.field input,.field textarea{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-weight:700;width:100%}
.field textarea{padding:10px 14px;min-height:90px;font-size:13px;font-family:ui-monospace,monospace}
.note{font-size:13.5px;font-weight:700;min-height:20px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* installed app: keep clear of the iPhone notch and home bar */
.scene{padding-top:calc(18px + env(safe-area-inset-top))}
.page-h{padding-top:calc(26px + env(safe-area-inset-top))}
.nav-in{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet{padding-bottom:calc(26px + env(safe-area-inset-bottom))}
#app{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
</style>

/* ---------- state ---------- */
let S, memOnly=false;
const blank=()=>({demo:false,settings:{name:'Pähkel',kcalLimit:2000,waterGoal:2000},days:{},saved:[],fasts:[],activeFast:null,goals:{},sleep:null});
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(blank(),JSON.parse(raw));return}}catch(e){memOnly=true}
  S=seed();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memOnly=true}}
function seed(){
  const s=blank();s.demo=true;
  const today=new Date();
  const menu=[['Kaerahelbepuder',320],['Sushi (8 tk)',420],['Kanasalat',380],['Banaan',105],['Pasta bolognese',640],['Kohupiim',160],['Võileib juustuga',250],['Burger ja friikad',980],['Smuuti',210],['Hernesupp',300]];
  const plan=[[0,2,3,6,1900],[1,4,5,2250],[7,6,8,1500],[0,1,9,3,2000],[6,4,5,8,2500],[],[0,2,7,2100],[1,9,5,2000],[0,4,3,2000],[6,2,8,2400],[0,1,5,2000],[9,2,3,2250]];
  plan.forEach((p,i)=>{
    if(!p.length)return;
    const d=addDays(today,-(plan.length-i)),k=dkey(d),water=p[p.length-1];
    s.days[k]={foods:p.slice(0,-1).map((m,j)=>({id:uid(),name:menu[m][0],kcal:menu[m][1],t:d.getTime()+(8+j*4)*36e5})),water:[{id:uid(),ml:water,t:d.getTime()+12*36e5}]};
  });
  s.days[dkey(today)]={foods:[{id:uid(),name:'Kaerahelbepuder',kcal:320,t:Date.now()-5*36e5},{id:uid(),name:'Sushi (8 tk)',kcal:420,t:Date.now()-36e5}],water:[{id:uid(),ml:750,t:Date.now()-2*36e5}]};
  s.saved=[{id:uid(),name:'Sushi (8 tk)',kcal:420},{id:uid(),name:'Kaerahelbepuder',kcal:320},{id:uid(),name:'Banaan',kcal:105}];
  [[9,16,16],[6,14.500,16],[4,16.200,16],[2,18,18],[1,12.300,12]].forEach(([ago,h,g])=>{
    const end=addDays(today,-ago).getTime()+11.500*36e5;
    s.fasts.push({id:uid(),start:end-h*36e5,end,goalH:g});
  });
  const mk=(t,d)=>({id:uid(),text:t,done:!!d});
  s.goals['w:'+dkey(monday(today))]=[mk('Joo iga päev 2 liitrit vett',1),mk('Kaks 16-tunnist paastu'),mk('Ära söö pärast kella 20')];
  s.goals['m:'+today.getFullYear()+'-'+pad(today.getMonth()+1)]=[mk('20 korras päeva'),mk('Proovi kolme uut tervislikku retsepti',1)];
  s.goals['y:'+today.getFullYear()]=[mk('Hoia seeriat 30 päeva järjest')];
  return s;
}

/* ---------- calculations ---------- */
const day=k=>S.days[k]||{foods:[],water:[]};
const kcalOf=k=>day(k).foods.reduce((a,f)=>a+f.kcal,0);
const waterOf=k=>day(k).water.reduce((a,w)=>a+w.ml,0);
const hasData=k=>day(k).foods.length>0||day(k).water.length>0;
const isOk=k=>day(k).foods.length>0&&kcalOf(k)<=S.settings.kcalLimit&&waterOf(k)>=S.settings.waterGoal;
function streak(){
  let n=0,d=new Date();
  if(isOk(dkey(d)))n++;
  d=addDays(d,-1);
  while(isOk(dkey(d))){n++;d=addDays(d,-1)}
  return n;
}
function hearts(){
  const keys=Object.keys(S.days).filter(hasData).sort();
  let h=4;if(!keys.length)return h;
  const tk=dkey(new Date());
  for(let d=fromKey(keys[0]);dkey(d)<tk;d=addDays(d,1)) h=isOk(dkey(d))?Math.min(4,h+1):Math.max(0,h-1);
  if(isOk(tk))h=Math.min(4,h+1);
  return h;
}
const fastsEndedOn=k=>S.fasts.filter(f=>dkey(new Date(f.end))===k);

function niceMax(v){if(v<=0)return 1;const s=Math.pow(10,Math.floor(Math.log10(v)))/2;return Math.ceil(v/s)*s}
function chart(vals,o){
  const W=320,H=168,pr=44,pt=14,pb=26,pw=W-pr,ph=H-pt-pb,bw=22;
  const act=vals.filter(v=>v>0),avg=act.length?act.reduce((a,b)=>a+b,0)/act.length:0;
  const max=niceMax(Math.max(...vals,o.limit||0,avg)*1.050);
  const y=v=>pt+ph-(v/max)*ph;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}">`;
  [0,.5,1].forEach(f=>{const yy=y(max*f);
    s+=`<line x1="0" x2="${pw}" y1="${yy}" y2="${yy}" stroke="#F3E3E9" stroke-width="1.500" stroke-dasharray="3 4"/><text x="${W}" y="${yy+4}" text-anchor="end" font-size="11.500" font-weight="700" fill="#A08B97">${o.tick(max*f)}</text>`});
  vals.forEach((v,i)=>{
    const cx=(i+.5)*(pw/7),x=cx-bw/2;
    if(v>0){const yy=y(v),r=Math.min(8,(pt+ph-yy));
      const col=o.limit&&v>o.limit?'#E0533A':o.color;
      s+=`<path class="cb" d="M${x} ${pt+ph}V${yy+r}Q${x} ${yy} ${x+r} ${yy}H${x+bw-r}Q${x+bw} ${yy} ${x+bw} ${yy+r}V${pt+ph}Z" fill="${col}"><title>${DOW[i]}: ${o.tip(v)}</title></path>`}
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12.500" font-weight="800" fill="${i===o.today?'#3B2A35':'#A08B97'}">${DOW[i]}</text>`;
    if(i===o.today)s+=`<circle cx="${cx}" cy="${H-2.500}" r="2" fill="#3B2A35"/>`;
  });
  if(o.limit){const yy=y(o.limit);s+=`<line x1="0" x2="${pw}" y1="${yy}" y2="${yy}" stroke="#E0533A" stroke-width="1.500"/><text x="2" y="${yy-5}" font-size="11" font-weight="800" fill="#E0533A">limiit</text>`}
  if(avg>0){const yy=y(avg);s+=`<line x1="0" x2="${pw}" y1="${yy}" y2="${yy}" stroke="#3B2A35" stroke-width="1.600" stroke-dasharray="4 3"/><text x="${pw-2}" y="${yy-5}" text-anchor="end" font-size="11" font-weight="800" fill="#3B2A35">kesk.</text>`}
  return {svg:s+'</svg>',avg,count:act.length};
}

/* ---------- vision board: pictures with a comment, kept in IndexedDB ---------- */
let vision=[],visDb=null,visPending=null,visMem=false;
function visOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('orava-paevik',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('vision',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function visTx(mode,fn){return new Promise((res,rej)=>{if(!visDb)return rej(new Error('no db'));const tx=visDb.transaction('vision',mode),st=tx.objectStore('vision'),rq=fn(st);
  tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
async function visLoad(){try{visDb=await visOpen();vision=(await visTx('readonly',st=>st.getAll())||[]).sort((a,b)=>b.t-a.t)}catch(e){visMem=true}
  if(view==='goals'&&goalTab==='v')render()}
async function visPut(v){try{await visTx('readwrite',st=>st.put(v));return true}catch(e){visMem=true;return false}}
async function visDel(id){try{await visTx('readwrite',st=>st.delete(id))}catch(e){visMem=true}}
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('read'));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('decode'));
    im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.84))};im.src=fr.result};fr.readAsDataURL(file)})}

  else openSheet(head+`
   <div class="card">
     <div class="row" style="margin-bottom:12px">${[250,500,750].map(m=>`<button class="btn soft" data-act="water" data-ml="${m}">${I.drop('#5EAEF2')} +${m} ml</button>`).join('')}</div>
     <form id="waterForm" novalidate><div class="field"><label for="wMl">Oma kogus (ml)</label><input id="wMl" type="number" inputmode="numeric" min="1" max="5000" placeholder="nt 330"></div>
     <button type="submit" class="btn block">Lisa vesi</button></form>
     <p class="note" id="waterNote" role="status">Täna joodud ${fmt(waterOf(dkey(new Date())))} / ${fmt(S.settings.waterGoal)} ml</p>
     <button class="btn sm soft" data-act="undo-water" style="margin-top:6px">Võta viimane vesi tagasi</button>
   </div>`);
}
function settingsSheet(){
  openSheet(`<div class="sheet-h"><h2>Seaded</h2><button class="icon-btn" style="background:#fff" data-act="close" aria-label="Sulge">${I.x}</button></div>
  <form id="setForm" class="card" novalidate>
    <div class="field"><label for="sName">Orava nimi</label><input id="sName" maxlength="16" value="${esc(S.settings.name)}"></div>
    <div class="field"><label for="sKcal">Päeva kalorilimiit (kcal)</label><input id="sKcal" type="number" inputmode="numeric" min="500" max="10000" value="${S.settings.kcalLimit}"></div>
    <div class="field"><label for="sWater">Päeva vee-eesmärk (ml)</label><input id="sWater" type="number" inputmode="numeric" min="250" max="10000" value="${S.settings.waterGoal}"></div>
    <button type="submit" class="btn block">Salvesta seaded</button><p class="note" id="setNote" role="status"></p>
  </form>
  <div class="card" style="margin-top:12px"><div class="card-h"><span class="label">Varukoopia</span></div>
    <p class="small muted" style="margin-bottom:10px">Andmed on ainult selles telefonis. Kopeeri varukoopia ja hoia seda näiteks märkmetes. Visioonitahvli pildid varukoopiasse ei lähe.</p>
    <button class="btn soft block" data-act="export">Kopeeri varukoopia</button>
    <div class="field" style="margin-top:12px"><label for="imp">Taasta varukoopiast</label><textarea id="imp" placeholder="Kleebi varukoopia tekst siia"></textarea></div>
    <button class="btn soft block" data-act="import">Taasta</button><p class="note" id="bakNote" role="status"></p></div>
  <div class="card" style="margin-top:12px"><div class="card-h"><span class="label">Andmete kustutamine</span></div>
    <button class="btn soft block" data-act="wipe" id="wipeBtn">Kustuta kõik andmed</button></div>`);
}

/* ---------- actions ---------- */
function addFood(name,kcal){const k=dkey(new Date());S.days[k]=S.days[k]||{foods:[],water:[]};S.days[k].foods.push({id:uid(),name,kcal,t:Date.now()});save();toast(`Lisatud: ${name}, ${fmt(kcal)} kcal`)}
function addWater(ml){const k=dkey(new Date());S.days[k]=S.days[k]||{foods:[],water:[]};S.days[k].water.push({id:uid(),ml,t:Date.now()});save();toast(`Lisatud ${fmt(ml)} ml vett`)}
function readFood(){
  const name=$('#fName').value.trim(),kcal=Math.round(Number($('#fKcal').value)),note=$('#foodNote');
  if(!name){note.textContent='Kirjuta toidu nimi.';$('#fName').focus();return null}
  if(!$('#fKcal').value||!(kcal>=0)||kcal>20000){note.textContent='Kirjuta kalorid numbrina (0 kuni 20 000).';$('#fKcal').focus();return null}
  return {name,kcal};
}
let wipeArmed=false;
document.addEventListener('click',e=>{
  if(e.target.id==='scrim'){closeSheet();return}
  const q=e.target.closest('.sq');if(q){if(pet.moved){pet.moved=false;return}q.classList.remove('hop');void q.getBoundingClientRect();q.classList.add('hop');return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset;
  if(a==='go'){if(view!==d.v){view=d.v;render();enter();window.scrollTo(0,0)}}
  else if(a==='feed-toggle'){feedOpen=!feedOpen;$('.feed').classList.toggle('open',feedOpen);b.setAttribute('aria-expanded',feedOpen);const c=$('.bubble');if(feedOpen&&c){if(!c.dataset.t)c.dataset.t=c.textContent;c.textContent='Lohista toit minu juurde!';clearTimeout(eatTimer);eatTimer=setTimeout(()=>{const z=$('.bubble');if(z&&z.dataset.t){z.textContent=z.dataset.t;delete z.dataset.t}},2600)}}
  else if(a==='sleep-toggle'){
    if(!S.sleep){S.sleep={start:Date.now()};feedOpen=false;save();render();enter()}
    else{const dur=Date.now()-S.sleep.start;S.lastSleep={start:S.sleep.start,end:Date.now()};S.sleep=null;save();render();enter();
      const c=$('.bubble');if(c){c.dataset.t=c.textContent;c.textContent=dur<60000?'Tere! Ma ei jõudnud veel uinudagi.':`Tere hommikust! Magasin ${hm(dur)}.`;clearTimeout(eatTimer);eatTimer=setTimeout(()=>{const z=$('.bubble');if(z&&z.dataset.t){z.textContent=z.dataset.t;delete z.dataset.t}},5000)}}}
  else if(a==='open-add'){addTab='food';addSheet()}
  else if(a==='add-tab'){addTab=d.t;addSheet()}
  else if(a==='open-settings'){wipeArmed=false;settingsSheet()}
  else if(a==='close')closeSheet();
  else if(a==='water'){addWater(Number(d.ml));render();const n=$('#waterNote');if(n)n.textContent=`Lisatud ${d.ml} ml. Täna joodud ${fmt(waterOf(dkey(new Date())))} / ${fmt(S.settings.waterGoal)} ml`}
  else if(a==='undo-water'){const w=day(dkey(new Date())).water;const n=$('#waterNote');if(w.length){const x=w.pop();save();render();n.textContent=`Võtsin ${x.ml} ml tagasi. Täna joodud ${fmt(waterOf(dkey(new Date())))} ml`}else n.textContent='Täna pole vett kirjas.'}
  else if(a==='save-food'){const f=readFood();if(!f)return;
    if(S.saved.some(s=>s.name.toLowerCase()===f.name.toLowerCase()&&s.kcal===f.kcal))$('#foodNote').textContent='See toit on juba salvestatud.';
    else{S.saved.unshift({id:uid(),...f});save();$('#savedList').innerHTML=savedList();$('#foodNote').textContent=`"${f.name}" on salvestatud.`}}
  else if(a==='add-saved'){const f=S.saved.find(s=>s.id===d.id);if(f){addFood(f.name,f.kcal);render();closeSheet()}}
  else if(a==='del-saved'){S.saved=S.saved.filter(s=>s.id!==d.id);save();$('#savedList').innerHTML=savedList()}
  else if(a==='del-food'){const x=S.days[d.k];if(x){x.foods=x.foods.filter(f=>f.id!==d.id);save();render()}}
  else if(a==='del-fast'){S.fasts=S.fasts.filter(f=>f.id!==d.id);save();render()}
  else if(a==='fast-goal'){fastGoal=Number(d.h);$('#fastCard').innerHTML=fastCard()}
  else if(a==='fast-start'){const c=$('#fastCustom'),v=c&&c.value?Number(c.value):fastGoal;
    if(!(v>0)||v>168){c.focus();return}
    fastGoal=v;S.activeFast={start:Date.now(),goalH:v};save();$('#fastCard').innerHTML=fastCard();tick()}
  else if(a==='fast-stop'){const f=S.activeFast;if(f){S.fasts.push({id:uid(),start:f.start,end:Date.now(),goalH:f.goalH});S.activeFast=null;save();render()}}
  else if(a==='goal-tab'){if(goalTab!==d.t){goalTab=d.t;render();enter()}}
  else if(a==='vis-add')visAddSheet();
  else if(a==='vis-open')visOpenSheet(d.id);
  else if(a==='vis-del'){if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Vajuta uuesti';b.style.background='#FFD9CC'}else{vision=vision.filter(x=>x.id!==d.id);visDel(d.id);closeSheet();render()}}
  else if(a==='goal-nav'){goalOff[goalTab]+=Number(d.d);render();enter()}
  else if(a==='goal-toggle'){const g=(S.goals[goalPeriod().key]||[]).find(x=>x.id===d.id);if(g){g.done=!g.done;save();render()}}
  else if(a==='goal-del'){const k=goalPeriod().key;S.goals[k]=(S.goals[k]||[]).filter(x=>x.id!==d.id);if(!S.goals[k].length)delete S.goals[k];save();render()}
  else if(a==='cal-day'){calSel=d.k;render()}
  else if(a==='cal-nav'){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+Number(d.d),1);render();enter()}
  else if(a==='week-nav'){weekOff=Math.min(0,weekOff+Number(d.d));render();enter()}
  else if(a==='clear-demo'){const s=S.settings;S=blank();S.settings=s;save();render()}
  else if(a==='export'){const txt=JSON.stringify(S),n=$('#bakNote');
    navigator.clipboard.writeText(txt).then(()=>n.textContent='Varukoopia on kopeeritud. Kleebi see kuhugi kindlasse kohta.')
     .catch(()=>{$('#imp').value=txt;$('#imp').select();n.textContent='Kopeerimine ei õnnestunud. Tekst on allpool kastis, kopeeri see käsitsi.'})}
  else if(a==='import'){const n=$('#bakNote');try{const o=JSON.parse($('#imp').value);if(!o||typeof o.days!=='object'||!o.settings)throw 0;S=Object.assign(blank(),o);save();render();n.textContent='Andmed on taastatud.'}catch(_){n.textContent='See tekst ei ole selle äpi varukoopia. Kleebi kogu kopeeritud tekst.'}}
  else if(a==='wipe'){if(!wipeArmed){wipeArmed=true;b.textContent='Vajuta uuesti, et kõik kustutada';b.style.background='#FFD9CC'}else{S=blank();save();vision.forEach(v=>visDel(v.id));vision=[];closeSheet();render()}}
});
/* petting and tickling: stroke the squirrel with a finger or the mouse */
const pet={down:false,moved:false,d:0,x:0,y:0,timer:0,last:0};
function tickle(q,e){
  const b=$('.bubble');
  if(!q.classList.contains('tickle')){q.classList.add('tickle');if(b&&!b.dataset.t){b.dataset.t=b.textContent;b.textContent='Hihihi! Kõdi on!'}}
  clearTimeout(pet.timer);
  pet.timer=setTimeout(()=>{const z=$('.sq'),c=$('.bubble');if(z)z.classList.remove('tickle');if(c&&c.dataset.t){c.textContent=c.dataset.t;delete c.dataset.t}},900);
  const now=Date.now();
  if(now-pet.last>230){pet.last=now;const w=$('.pet-wrap'),r=w.getBoundingClientRect(),el=document.createElement('span');
    el.className='pop';el.innerHTML=Math.random()<.5?I.heart(true):(Math.random()<.5?'hihi!':'hihihi');
    el.style.left=(e.clientX-r.left)+'px';el.style.top=(e.clientY-r.top)+'px';el.style.setProperty('--dx',(Math.random()*50-25).toFixed(0)+'px');
    w.appendChild(el);setTimeout(()=>el.remove(),1000)}
}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.sq')){pet.down=true;pet.moved=false;pet.d=0;pet.x=e.clientX;pet.y=e.clientY}});
document.addEventListener('pointermove',e=>{if(!pet.down)return;const q=$('.sq');if(!q)return;
  pet.d+=Math.hypot(e.clientX-pet.x,e.clientY-pet.y);pet.x=e.clientX;pet.y=e.clientY;
  if(pet.d>22){pet.moved=true;tickle(q,e)}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{pet.down=false}));

/* feeding: drag a treat from the left menu onto the squirrel */
let drag=null,eatTimer=0;
const overPet=(x,y)=>{const q=$('.sq');if(!q)return false;const r=q.getBoundingClientRect();return x>r.left+r.width*.08&&x<r.right-r.width*.08&&y>r.top&&y<r.bottom};
function feed(k){
  const q=$('.sq'),w=$('.pet-wrap'),b=$('.bubble');if(!q||!w)return;
  const r=q.getBoundingClientRect(),wr=w.getBoundingClientRect();
  const mx=r.left+r.width*126/260-wr.left,my=r.top+r.height*166/276-wr.top;
  q.classList.remove('want','tickle');q.classList.add('eat');
  const bite=document.createElement('span');bite.className='bite';bite.innerHTML=TREATS[k][1];bite.style.left=mx+'px';bite.style.top=my+'px';w.appendChild(bite);
  ['näm!','näm-näm'].forEach((t,i)=>setTimeout(()=>{const el=document.createElement('span');el.className='pop';el.textContent=t;el.style.left=(mx+(i?34:-34))+'px';el.style.top=(my-10)+'px';el.style.setProperty('--dx',(i?22:-22)+'px');w.appendChild(el);setTimeout(()=>el.remove(),1000)},250+i*420));
  if(b){if(!b.dataset.t)b.dataset.t=b.textContent;b.textContent='Nämm! '+TREATS[k][0]+' on nii hea!'}
  clearTimeout(eatTimer);clearTimeout(pet.timer);
  eatTimer=setTimeout(()=>{bite.remove();const z=$('.sq'),c=$('.bubble');if(z)z.classList.remove('eat');
    if(w.isConnected){const h=document.createElement('span');h.className='pop';h.innerHTML=I.heart(true);h.style.left=mx+'px';h.style.top=(my-40)+'px';h.style.setProperty('--dx','0px');w.appendChild(h);setTimeout(()=>h.remove(),1000)}
    if(c&&c.dataset.t){c.textContent=c.dataset.t;delete c.dataset.t}},1300);
}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.treat');if(!t)return;e.preventDefault();
  const g=document.createElement('div');g.className='ghost';g.innerHTML=TREATS[t.dataset.treat][1];g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';document.body.appendChild(g);
  t.classList.add('lifted');drag={k:t.dataset.treat,g,t,sx:e.clientX,sy:e.clientY,moved:false}});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;
  const q=$('.sq');if(q&&!q.classList.contains('eat'))q.classList.toggle('want',overPet(e.clientX,e.clientY))});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;d.g.remove();d.t.classList.remove('lifted');
  const q=$('.sq');if(q)q.classList.remove('want');
  if(!d.moved||overPet(e.clientX,e.clientY))feed(d.k)});
document.addEventListener('pointercancel',()=>{if(!drag)return;drag.g.remove();drag.t.classList.remove('lifted');drag=null;const q=$('.sq');if(q)q.classList.remove('want')});
document.addEventListener('click',e=>{const t=e.target.closest('.treat');if(t&&e.detail===0)feed(t.dataset.treat)});

document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='visForm'){const n=$('#visNote');if(!visPending){n.textContent='Vali kõigepealt pilt.';return}
    const v={id:uid(),img:visPending,text:$('#vText').value.trim(),t:Date.now()};vision.unshift(v);visPending=null;visPut(v).then(()=>{if(visMem&&view==='goals')render()});closeSheet();render();return}
  if(e.target.id==='visEdit'){const v=vision.find(x=>x.id===e.target.dataset.id);if(v){v.text=$('#vText').value.trim();visPut(v)}closeSheet();render();return}
  if(e.target.id==='goalForm'){const t=$('#gText').value.trim();if(!t){$('#gText').focus();return}
    const k=goalPeriod().key;(S.goals[k]=S.goals[k]||[]).push({id:uid(),text:t,done:false});save();render();$('#gText').focus();return}
  if(e.target.id==='foodForm'){const f=readFood();if(!f)return;addFood(f.name,f.kcal);render();closeSheet()}
  else if(e.target.id==='waterForm'){const ml=Math.round(Number($('#wMl').value)),n=$('#waterNote');
    if(!(ml>0)||ml>5000){n.textContent='Kirjuta kogus milliliitrites (1 kuni 5000).';$('#wMl').focus();return}
    addWater(ml);render();$('#wMl').value='';n.textContent=`Lisatud ${ml} ml. Täna joodud ${fmt(waterOf(dkey(new Date())))} / ${fmt(S.settings.waterGoal)} ml`}
  else if(e.target.id==='setForm'){const name=$('#sName').value.trim()||'Orav',kc=Math.round(Number($('#sKcal').value)),w=Math.round(Number($('#sWater').value)),n=$('#setNote');
    if(!(kc>=500&&kc<=10000)){n.textContent='Kalorilimiit peab olema 500 kuni 10 000 kcal.';$('#sKcal').focus();return}
    if(!(w>=250&&w<=10000)){n.textContent='Vee-eesmärk peab olema 250 kuni 10 000 ml.';$('#sWater').focus();return}
    S.settings={name,kcalLimit:kc,waterGoal:w};save();render();n.textContent='Seaded on salvestatud.'}
});
document.addEventListener('input',e=>{if(e.target.id==='fastCustom'&&e.target.value){fastGoal=Number(e.target.value);document.querySelectorAll('[data-act="fast-goal"]').forEach(c=>c.setAttribute('aria-pressed','false'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)closeSheet()});

load();render();visLoad();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* loading screen: stays until fonts are ready, at least about a second, then fades into the app */
(function(){const sp=$('#splash'),t0=Date.now();$('#spArt').innerHTML=NUT.replace(/"pk"/g,'"pk2"').replace(/#pk\)/g,'#pk2)').replace(/"pkg"/g,'"pkg2"').replace(/#pkg\)/g,'#pkg2)');
  const done=()=>setTimeout(()=>{sp.classList.add('out');enter()},Math.max(0,1150-(Date.now()-t0)));
  const fonts=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  Promise.race([fonts,new Promise(r=>setTimeout(r,2500))]).then(done,done)})();
</script>
</body>
</html>
